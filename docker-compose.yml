services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dynamiclab
      POSTGRES_USER: dynamiclab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - dynamiclab_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dynamiclab"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-before-production}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      DJANGO_TIME_ZONE: ${DJANGO_TIME_ZONE:-Asia/Bangkok}
      DATABASE_URL: postgres://dynamiclab:${POSTGRES_PASSWORD:-change-me}@db:5432/dynamiclab
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-0}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-1}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-Dynamic LabSystems <no-reply@dynamiclabsystems.example>}
      SAMPLE_NOTIFICATION_EMAIL: ${SAMPLE_NOTIFICATION_EMAIL:-info@dynamicapac.com}
    volumes:
      - dynamiclab_media:/app/media
    ports:
      - "${WEB_PORT:-8000}:8000"

volumes:
  dynamiclab_pgdata:
  dynamiclab_media:
