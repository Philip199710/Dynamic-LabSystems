{% extends "base.html" %}
{% block title %}Register sample · {{ SITE_NAME }}{% endblock %}
{% block content %}
<div class="page-header"><h1>Register a new sample</h1></div>
<div class="card" style="max-width:560px;">
  <form method="post">
    {% csrf_token %}
    {% for field in form %}
    <div class="field">
      <label for="{{ field.id_for_label }}">{{ field.label }}</label>
      {{ field }}
      {% if field.help_text %}<div class="help">{{ field.help_text }}</div>{% endif %}
      {{ field.errors }}
    </div>
    {% endfor %}
    <button type="submit" class="btn">Register sample</button>
  </form>
</div>
{% endblock %}
